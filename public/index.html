<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>HomeLogger</title>
<style>
:root{--bg:#0b0f17;--card:#141a26;--card2:#1b2333;--line:#263047;--tx:#e8edf7;--mut:#8b97b1;--acc:#2ee6a6;--acc2:#4aa8ff;--warn:#ffb84a;--bad:#ff5d6c;--r:16px}
:root[data-theme=light]{--bg:#f3f5f9;--card:#fff;--card2:#eef1f7;--line:#dbe0ec;--tx:#141a26;--mut:#5d6985}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center}
main{max-width:900px;margin:0 auto;padding:16px}
nav.bot{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.bot button{flex:1;background:none;border:0;color:var(--mut);padding:6px;font-size:11px;cursor:pointer}
nav.bot button span{display:block;font-size:22px}
nav.bot button.on{color:var(--acc)}
nav.bot button{position:relative}
nav.bot button.upd::after{content:'';position:absolute;top:4px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.area{cursor:pointer;position:relative;overflow:hidden;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.area .ic{font-size:34px;margin-bottom:auto}
.area .nm{font-weight:650}
.area .st{font-size:13px;color:var(--mut)}
.area .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.area .cover{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28}
.area>*{position:relative}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.pill.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
h2{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--acc);color:#04130d;border-color:var(--acc);font-weight:650}
.btn{background:var(--acc);color:#04130d;border:0;border-radius:12px;padding:10px 16px;font-weight:650;cursor:pointer;font-size:15px}
.btn.sec{background:var(--card2);color:var(--tx)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.fab{position:fixed;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#04130d;font-size:30px;border:0;box-shadow:0 8px 24px #0008;cursor:pointer;z-index:6}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 12px;font:inherit}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#04130d;border-color:var(--acc)}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.empty .big{font-size:42px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:30;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--acc);font-weight:650;cursor:pointer}
.banner{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--card2);flex:none;display:grid;place-items:center;font-size:22px}
a{color:var(--acc2)}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero .bigic{font-size:44px}
.small{font-size:13px;color:var(--mut)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.quick button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px 6px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick button span{font-size:24px}
.two{display:flex;gap:22px;flex-wrap:wrap}.big2{font-size:22px;font-weight:700}
.prog{height:6px;background:var(--card2);border-radius:99px;margin-top:6px;overflow:hidden}.prog div{height:100%;background:var(--acc);border-radius:99px}
label.pick{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:var(--tx);margin:0;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
label.pick input{width:auto;padding:0;border:0;background:none;margin-top:3px;flex:none}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.phs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--card2)}
.rep{background:#fff;color:#111;border-radius:12px;padding:18px;line-height:1.35}
.rep h1{font-size:22px;margin:0 0 4px}
.rep h2{color:#111;text-transform:none;letter-spacing:0;font-size:18px;border-bottom:2px solid #222;padding-bottom:3px;margin:22px 0 8px}
.rep h3{font-size:14px;margin:12px 0 4px}
.rep table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.rep td,.rep th{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left;vertical-align:top}
.rep th{background:#f2f2f2;font-size:12px}
.rep .nw{white-space:nowrap}.rep .r{text-align:right}.rep .small{color:#555}
.rimgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.rimgs img{height:90px;border-radius:6px;object-fit:cover}
@media print{header,nav.bot,.fab,.noprint,.toast,.sheet-bg{display:none!important}body{background:#fff!important;padding:0!important}main{max-width:none;padding:0}.rep{border-radius:0;padding:0}.rep h2{break-after:avoid}.rep tr{break-inside:avoid}.rimgs img{height:110px}}
</style>
</head>
<body>
<header>
  <button class="ib" id="back" style="display:none" aria-label="Back">‹</button>
  <h1 id="title">HomeLogger</h1>
  <button class="ib" id="hsearch" aria-label="Search">🔍</button>
</header>
<main id="app"></main>
<nav class="bot" id="nav">
  <button data-v="home"><span>🏠</span>Home</button>
  <button data-v="docs"><span>📁</span>Documents</button>
  <button data-v="search"><span>🔍</span>Search</button>
  <button data-v="settings"><span>⚙️</span>Settings</button>
</nav>

<script src="features.js"></script>
<script>
'use strict';
const LOCAL = !!window.AndroidBridge; // true inside the Android app: data lives on the phone
let APP_VERSION = 'dev';
const GH_REPO = 'Orangitaz/HomeLogger';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = { areas: [], tasks: [], records: [], documents: [], facts: [], projects: [], settings: {} };
let view = { name: 'home' };
const stack = [];

const ICONS = ['🏠','❄️','🔥','🚿','💧','⚡','🧊','🍳','🧺','🪟','🚪','🌳','🏊','🔑','🛋️','🛏️','🚽','🏚️','🔌','🪜','🧯','🐜','🌡️','🚗'];
const COLORS = ['#2ee6a6','#4aa8ff','#ffb84a','#ff5d6c','#b58cff','#ff8ad8','#5ee0ff','#a3e635'];
const QUICK = {'HVAC':'❄️','Roof':'🏚️','Water heater':'🚿','Plumbing':'💧','Electrical':'⚡','Kitchen':'🍳','Laundry':'🧺','Garage':'🚗','Yard':'🌳','Windows & doors':'🪟','Appliances':'🔌','Pool':'🏊'};
const DOC_CATS = ['Receipt','Warranty','Manual','Insurance','Deed / Title','Permit','Inspection','Tax','Contract','Photo','Before','Progress','After','Other'];
const REC_TYPES = { maintenance: '🔧 Maintenance', repair: '🛠️ Repair', upgrade: '⬆️ Upgrade' };
const INTERVALS = [['', 'One-time'], ['1', 'Every month'], ['3', 'Every 3 months'], ['6', 'Every 6 months'], ['12', 'Every year'], ['24', 'Every 2 years'], ['36', 'Every 3 years'], ['60', 'Every 5 years'], ['120', 'Every 10 years']];

async function remoteApi(method, url, body, raw) {
  const opt = { method, headers: {} };
  if (raw) { opt.body = raw; } else if (body !== undefined) { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function load() { S = await api('GET', '/api/all'); }
const api = (...a) => (LOCAL ? localApi : remoteApi)(...a);

// ---------- Standalone (Android) storage: IndexedDB ----------
let LDB = null;
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open('homelogger', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const rq = fn(t.objectStore(store)); t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    put: (s, k, v) => run(s, 'readwrite', o => { o.put(v, k); return null; }),
    del: (s, k) => run(s, 'readwrite', o => { o.delete(k); return null; }),
    keys: s => run(s, 'readonly', o => o.getAllKeys()),
  };
})();
const lsave = async quiet => { await idb.put('kv', 'db', LDB); if (!quiet) { if (syncing) dirtyDuringSync = true; scheduleSync(); } };
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
const LKEYS = {
  areas: ['name', 'icon', 'color', 'notes', 'coverId', 'details', 'order'],
  tasks: ['areaId', 'title', 'intervalMonths', 'nextDue', 'lastDone', 'notes'],
  records: ['areaId', 'projectId', 'type', 'date', 'title', 'vendor', 'notes', 'parts', 'cost'],
  documents: ['areaId', 'recordId', 'projectId', 'factId', 'category', 'title', 'notes', 'expires', 'fileId', 'fileName', 'mime', 'size'],
  facts: ['category', 'title', 'value', 'notes'],
  projects: ['areaId', 'title', 'status', 'notes', 'startDate', 'endDate', 'budget', 'checklist'],
};
const EMPTY_DB = () => ({ areas: [], tasks: [], records: [], documents: [], facts: [], projects: [], deleted: [], settings: { webhook: '' } });
const COLS = ['areas', 'tasks', 'records', 'documents', 'facts', 'projects'];
function addMonths(dateStr, m) {
  const d = new Date(dateStr + 'T12:00:00'); const day = d.getDate();
  d.setMonth(d.getMonth() + m); if (d.getDate() !== day) d.setDate(0);
  return d.toISOString().slice(0, 10);
}
async function localInit() {
  LDB = (await idb.get('kv', 'db')) || EMPTY_DB();
  if (!Array.isArray(LDB.deleted)) LDB.deleted = [];
  for (const c of COLS) if (!Array.isArray(LDB[c])) LDB[c] = [];
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { APP_VERSION = (await (await fetch('version.json')).json()).version || APP_VERSION; } catch (e) {}
}
async function localApi(method, url, body, raw) {
  const [a, b, c] = url.split('?')[0].split('/').filter(Boolean).slice(1);
  const now = () => new Date().toISOString();
  const pick = (o, keys) => { const r = {}; keys.forEach(k => { if (o && o[k] !== undefined) r[k] = o[k]; }); return r; };
  if (a === 'all') return JSON.parse(JSON.stringify(LDB));
  if (a === 'version') return { version: APP_VERSION };
  if (a === 'settings' && method === 'PUT') { LDB.settings = Object.assign({}, LDB.settings, pick(body, ['webhook'])); await lsave(); return LDB.settings; }
  if (a === 'files' && method === 'POST') { const fid = rid() + rid(); await idb.put('files', fid, raw); return { fileId: fid, size: raw.size }; }
  if (LKEYS[a]) {
    const list = LDB[a];
    if (method === 'POST' && !b) { const created = now(); const item = Object.assign({ id: rid(), createdAt: created, updatedAt: created }, pick(body, LKEYS[a])); list.push(item); await lsave(); return item; }
    const item = list.find(x => x.id === b);
    if (!item) throw new Error('not found');
    if (a === 'tasks' && c === 'done' && method === 'POST') {
      const date = (body && body.date) || today();
      item.lastDone = date; item.nextDue = item.intervalMonths ? addMonths(date, parseInt(item.intervalMonths, 10)) : ''; item.updatedAt = now();
      const rec = { id: rid(), createdAt: item.updatedAt, updatedAt: item.updatedAt, areaId: item.areaId, type: 'maintenance', date, title: item.title, vendor: (body && body.vendor) || '', notes: (body && body.notes) || '', parts: '' };
      LDB.records.push(rec); await lsave(); return { task: item, record: rec };
    }
    if (method === 'PUT') {
      if (a === 'areas' && body.coverId && item.coverId && body.coverId !== item.coverId) await idb.del('files', item.coverId);
      Object.assign(item, pick(body, LKEYS[a]), { updatedAt: now() }); await lsave(); return item;
    }
    if (method === 'DELETE') {
      list.splice(list.indexOf(item), 1);
      const bury = (col, x) => { LDB.deleted = LDB.deleted.filter(t => !(t.col === col && t.id === x.id)); LDB.deleted.push({ col, id: x.id, at: now() }); };
      bury(a, item);
      const dropped = [];
      const drop = (c, pred) => {
        const g = LDB[c].filter(pred); LDB[c] = LDB[c].filter(x => !g.includes(x));
        g.forEach(x => { bury(c, x); if (c === 'documents') dropped.push(x); });
        return new Set(g.map(x => x.id));
      };
      if (a === 'areas') {
        drop('tasks', t => t.areaId === item.id);
        const recs = drop('records', r => r.areaId === item.id);
        const projs = drop('projects', p => p.areaId === item.id);
        drop('documents', d => d.areaId === item.id || recs.has(d.recordId) || projs.has(d.projectId));
        if (item.coverId) await idb.del('files', item.coverId);
      } else if (a === 'records') drop('documents', d => d.recordId === item.id);
      else if (a === 'facts') drop('documents', d => d.factId === item.id);
      else if (a === 'projects') {
        drop('documents', d => d.projectId === item.id);
        for (const r of LDB.records) if (r.projectId === item.id) { r.projectId = ''; r.updatedAt = now(); } // keep the work entries, just unlink
      } else if (a === 'documents') dropped.push(item);
      for (const d of dropped) if (d.fileId) await idb.del('files', d.fileId);
      await lsave(); return { ok: true };
    }
  }
  throw new Error('not found');
}

// ---------- Sync with the TrueNAS server (Android app only) ----------
// Push what changed here, pull what changed there. Newest edit wins per item; a delete wins over an older edit.
let syncing = false, syncTimer = null, dirtyDuringSync = false;
const syncCfg = () => { try { return JSON.parse(localStorage.getItem('hl-sync')) || null; } catch (e) { return null; } };
const setSyncCfg = c => { try { if (c) localStorage.setItem('hl-sync', JSON.stringify(c)); else localStorage.removeItem('hl-sync'); } catch (e) {} };
const tsOf = x => x.updatedAt || x.createdAt || '';
function scheduleSync(ms) { if (!LOCAL || !syncCfg()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms == null ? 4000 : ms); }
// Request done by the Android app itself (see MainActivity.Bridge.http*), returned as a normal Response.
const nativeWaiters = {};
window.__httpDone = (id, status, headers, err) => { const w = nativeWaiters[id]; if (w) { delete nativeWaiters[id]; w({ status, headers, err }); } };
async function nativeFetch(url, o) {
  const id = rid() + rid();
  AndroidBridge.httpBegin(id, String(o.method || 'GET').toUpperCase(), url, JSON.stringify(o.headers || {}));
  try {
    if (o.body) await eachB64(o.body instanceof Blob ? o.body : new Blob([o.body]), c => AndroidBridge.httpBody(id, c));
    const done = new Promise(res => { nativeWaiters[id] = res; });
    AndroidBridge.httpSend(id);
    const { status, headers, err } = await done;
    if (!status) throw new Error(err || 'network error');
    const size = AndroidBridge.httpSize(id), parts = [];
    for (let off = 0; off < size; off += CHUNK) { const b64 = AndroidBridge.httpRead(id, off, CHUNK); const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); parts.push(u); }
    let type = ''; try { type = JSON.parse(headers)['content-type'] || ''; } catch (e) {}
    return new Response(new Blob(parts, { type }), { status });
  } finally { AndroidBridge.httpClose(id); }
}
async function sfetch(path, opt) {
  const c = syncCfg(); const o = Object.assign({}, opt); o.headers = Object.assign({}, o.headers);
  if (c.password) o.headers.Authorization = 'Basic ' + btoa('homelogger:' + c.password);
  let r;
  try { r = await (typeof AndroidBridge.httpBegin === 'function' ? nativeFetch : fetch)(c.url + path, o); } catch (e) { throw new Error("Can't reach the server. Check the address, and that you're on your home network or VPN."); }
  if (r.status === 401) throw new Error('Wrong password');
  if (!r.ok) throw new Error('Server error ' + r.status);
  return r;
}
function syncText() {
  const c = syncCfg();
  if (!c) return 'Sync is off.';
  if (syncing) return 'Syncing…';
  if (c.error) return 'Last sync failed: ' + c.error;
  return c.last ? 'Last synced ' + new Date(c.last).toLocaleString() : 'Not synced yet.';
}
const paintSync = msg => { const el = document.querySelector('#syncStatus'); if (el) el.textContent = msg || syncText(); };
const fileRefs = db => { const r = new Set(); db.documents.forEach(d => d.fileId && r.add(d.fileId)); db.areas.forEach(a => a.coverId && r.add(a.coverId)); return r; };

// Merge the server's answer into the local data. Returns true if anything changed.
function applyPull(res, gone) {
  let changed = false;
  const dropFile = (col, x) => { const f = col === 'documents' ? x.fileId : col === 'areas' ? x.coverId : ''; if (f) gone.add(f); };
  for (const t of res.deleted || []) {
    if (!LDB[t.col]) continue;
    const i = LDB[t.col].findIndex(x => x.id === t.id);
    if (i >= 0) {
      if (tsOf(LDB[t.col][i]) > t.at) continue; // edited here after it was deleted elsewhere: keep it
      dropFile(t.col, LDB[t.col].splice(i, 1)[0]); changed = true;
    }
    if (!LDB.deleted.some(x => x.col === t.col && x.id === t.id)) LDB.deleted.push({ col: t.col, id: t.id, at: t.at });
  }
  for (const col of COLS) for (const x of (res.items && res.items[col]) || []) {
    const tomb = LDB.deleted.find(t => t.col === col && t.id === x.id);
    if (tomb && tomb.at >= tsOf(x)) continue;
    const i = LDB[col].findIndex(y => y.id === x.id);
    if (i < 0) { LDB[col].push(x); changed = true; }
    else if (tsOf(x) > tsOf(LDB[col][i])) {
      const old = LDB[col][i];
      if (col === 'areas' && old.coverId && old.coverId !== x.coverId) gone.add(old.coverId);
      LDB[col][i] = x; changed = true;
    }
  }
  // Drop anything whose area, work entry, project or home-info item no longer exists.
  const areaIds = new Set(LDB.areas.map(a => a.id));
  for (const col of ['tasks', 'records', 'projects']) LDB[col] = LDB[col].filter(x => { const ok = !x.areaId || areaIds.has(x.areaId); if (!ok) changed = true; return ok; });
  const recIds = new Set(LDB.records.map(r => r.id)), proIds = new Set(LDB.projects.map(r => r.id)), facIds = new Set(LDB.facts.map(r => r.id));
  LDB.documents = LDB.documents.filter(d => { const ok = (!d.areaId || areaIds.has(d.areaId)) && (!d.recordId || recIds.has(d.recordId)) && (!d.projectId || proIds.has(d.projectId)) && (!d.factId || facIds.has(d.factId)); if (!ok) { dropFile('documents', d); changed = true; } return ok; });
  const cutoff = new Date(Date.now() - 365 * 864e5).toISOString();
  LDB.deleted = LDB.deleted.filter(t => t.at > cutoff);
  return changed;
}

async function syncNow() {
  const c = syncCfg();
  if (!LOCAL || !c || syncing) return;
  syncing = true; dirtyDuringSync = false; paintSync('Syncing…');
  const started = new Date().toISOString();
  let changed = false;
  try {
    const last = c.lastPush || '';
    const items = {}; COLS.forEach(col => { items[col] = LDB[col].filter(x => !last || tsOf(x) >= last); });
    const deleted = LDB.deleted.filter(t => !last || t.at >= last);
    const res = await (await sfetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ since: c.since || 0, items, deleted }) })).json();
    for (const fid of res.needFiles || []) { const bl = await fileBlob(fid); if (bl) await sfetch('/api/files?id=' + fid, { method: 'POST', body: bl }); }
    const gone = new Set();
    changed = applyPull(res, gone);
    const have = new Set(await idb.keys('files')), refs = fileRefs(LDB);
    for (const fid of refs) if (!have.has(fid)) {
      try { await idb.put('files', fid, await (await sfetch('/api/files/' + fid)).blob()); changed = true; } catch (e) { if (/password|reach/i.test(e.message)) throw e; }
    }
    for (const fid of gone) if (!refs.has(fid)) await idb.del('files', fid);
    await lsave(true);
    setSyncCfg(Object.assign(syncCfg() || c, { since: res.now, lastPush: started, last: new Date().toISOString(), error: '' }));
  } catch (e) {
    const cur = syncCfg(); if (cur) setSyncCfg(Object.assign(cur, { error: e.message }));
  } finally {
    syncing = false;
    if (dirtyDuringSync) scheduleSync(1500);
    paintSync();
    if (syncCfg()) {
      await load();
      if (changed && !document.querySelector('.sheet-bg') && view.name !== 'settings') render();
    }
  }
}

// Files in local mode are blobs; <img src="/api/files/ID"> placeholders get swapped for blob: URLs.
const blobUrls = {};
const fileBlob = fid => idb.get('files', fid);
async function hydrate(root) {
  if (!LOCAL) return;
  for (const el of root.querySelectorAll('[src^="/api/files/"],[style*="/api/files/"]')) {
    const m = (el.getAttribute('src') || el.getAttribute('style') || '').match(/\/api\/files\/([a-f0-9]+)/); if (!m) continue;
    const fid = m[1];
    if (!blobUrls[fid]) { const bl = await fileBlob(fid); if (!bl) continue; blobUrls[fid] = URL.createObjectURL(bl); }
    if (el.hasAttribute('src')) el.setAttribute('src', blobUrls[fid]); else el.style.backgroundImage = 'url(' + blobUrls[fid] + ')';
  }
}
// Streams bytes to the native side in base64 chunks (a multiple of 3 bytes keeps each chunk whole).
const CHUNK = 786432;
async function eachB64(blob, fn) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  for (let i = 0; i < buf.length; i += CHUNK) {
    const part = buf.subarray(i, i + CHUNK); let s = '';
    for (let j = 0; j < part.length; j += 8192) s += String.fromCharCode.apply(null, part.subarray(j, j + 8192));
    fn(btoa(s));
  }
}
async function bridgeSend(fid, name, mime, action) {
  const bl = await fileBlob(fid); if (!bl) return toast('File not found');
  AndroidBridge.beginSave(name, mime, action);
  await eachB64(bl, c => AndroidBridge.writeB64(c));
  AndroidBridge.endSave();
}
async function localBackup() {
  AndroidBridge.beginSave('homelogger-backup-' + today() + '.json', 'application/json', 'download');
  const T = t => AndroidBridge.writeText(t);
  T('{"homelogger":1,"db":' + JSON.stringify(LDB) + ',"files":{');
  let first = true;
  for (const fid of await idb.keys('files')) {
    const bl = await fileBlob(fid); if (!bl) continue;
    T((first ? '' : ',') + JSON.stringify(fid) + ':{"mime":' + JSON.stringify(bl.type || '') + ',"b64":"'); first = false;
    await eachB64(bl, T);
    T('"}');
  }
  T('}}');
  AndroidBridge.endSave();
}
async function localRestore(file) {
  const parsed = JSON.parse(await file.text());
  const db = parsed.db || parsed;
  if (!db || !Array.isArray(db.areas)) throw new Error('Not a HomeLogger backup');
  for (const fid of await idb.keys('files')) await idb.del('files', fid);
  Object.keys(blobUrls).forEach(k => delete blobUrls[k]);
  LDB = Object.assign(EMPTY_DB(), db);
  if (!Array.isArray(LDB.deleted)) LDB.deleted = [];
  for (const [fid, f] of Object.entries(parsed.files || {})) {
    const bin = atob(f.b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    await idb.put('files', fid, new Blob([u], { type: f.mime || '' }));
  }
  const c = syncCfg(); if (c) setSyncCfg(Object.assign(c, { since: 0, lastPush: '' }));
  await lsave();
}
let UPDATE = null;
async function checkUpdate() {
  if (!LOCAL || APP_VERSION === 'dev') return;
  try {

const today = () => new Date().toISOString().slice(0, 10);
const days = d => Math.round((new Date(d + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5);
function fmt(d) { if (!d) return ''; return new Date(d + 'T12:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
function dueInfo(d) {
  if (!d) return { cls: '', txt: 'No date' };
  const n = days(d);
  if (n < 0) return { cls: 'bad', txt: Math.abs(n) + 'd overdue', n };
  if (n === 0) return { cls: 'warn', txt: 'Due today', n };
  if (n <= 30) return { cls: 'warn', txt: 'In ' + n + 'd', n };
  return { cls: 'ok', txt: fmt(d), n };
}

  const overdue = att.filter(x => x.n < 0);
  if (att.length) {
    h += `<div class="banner ${overdue.length ? 'bad' : ''}"><b>${overdue.length ? overdue.length + ' overdue · ' : ''}${att.length} need attention</b></div>`;
    h += att.slice(0, 8).map(x => x.kind === 'task' ? taskRow(x.t, true) :
      `<div class="row" data-doc="${x.d.id}"><div class="thumb">📄</div><div class="grow"><div class="t">${esc(x.d.title)}</div><div class="s">${esc(x.d.category || '')} · expires ${fmt(x.d.expires)}</div></div><span class="pill ${x.n < 0 ? 'bad' : 'warn'}">${x.n < 0 ? 'Expired' : x.n + 'd left'}</span></div>`).join('');
    if (att.length > 8) h += `<div class="small" style="margin:4px 0 12px">+ ${att.length - 8} more</div>`;
  }
  h += '<h2>My home</h2>';
  if (!S.areas.length) h += '<div class="empty"><div class="big">🏠</div><p>Add the areas and systems you maintain:<br>HVAC, roof, water heater, kitchen…</p><button class="btn" id="addArea">Add your first area</button></div>';
  else {
    h += '<div class="grid">' + S.areas.slice().sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9)).map(a => {
      const ts = S.tasks.filter(t => t.areaId === a.id && t.nextDue).sort((x, y) => x.nextDue < y.nextDue ? -1 : 1);
      const di = ts.length ? dueInfo(ts[0].nextDue) : null;
      return `<div class="card area" data-area="${a.id}"><div class="bar" style="background:${a.color || 'var(--acc)'}"></div>${a.coverId ? '<div class="cover" style="background-image:url(' + fileUrl(a.coverId) + ')"></div>' : ''}
        <div class="ic">${esc(a.icon || '🏠')}</div><div class="nm">${esc(a.name)}</div>
        <div class="st">${di ? '<span class="pill ' + di.cls + '">' + esc(di.txt) + '</span> ' + esc(ts[0].title) : S.tasks.filter(t => t.areaId === a.id).length ? 'All caught up' : 'No tasks yet'}</div></div>`;
    }).join('') + '</div>';
  }
  return h + '<button class="fab" id="fabArea" aria-label="Add area">+</button>';
}

function renderArea() {
  const a = areaOf(view.id); if (!a) { view = { name: 'home' }; return renderHome(); }
  const tab = view.tab || 'dash';
  const tasks = S.tasks.filter(t => t.areaId === a.id).sort((x, y) => (x.nextDue || '9') < (y.nextDue || '9') ? -1 : 1);
  const recs = S.records.filter(r => r.areaId === a.id).sort((x, y) => x.date < y.date ? 1 : -1);
  const docs = S.documents.filter(d => d.areaId === a.id).sort((x, y) => x.createdAt < y.createdAt ? 1 : -1);
  let h = `<div class="hero"><div class="bigic">${esc(a.icon)}</div><div class="grow"><div class="small">${tasks.length} tasks · ${recs.length} entries · ${docs.length} docs</div></div><button class="btn sec sm" id="editArea">Edit</button></div>`;
  h += '<div class="tabs">' + [['dash', 'Dashboard'], ['tasks', 'Tasks'], ['hist', 'History'], ['docs', 'Documents'], ['info', 'Info']].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('') + '</div>';
  let fab = '';
  if (tab === 'dash') {
    const next = tasks.filter(t => t.nextDue).slice(0, 4);
    h += '<h2>Upcoming</h2>' + (next.length ? next.map(t => taskRow(t)).join('') : '<div class="empty small">No reminders set. Add a task under Tasks.</div>');
    h += '<h2>Recent work</h2>' + (recs.length ? recs.slice(0, 4).map(recRow).join('') : '<div class="empty small">Nothing logged yet.</div>');
    const exp = docs.filter(d => d.expires).sort((x, y) => x.expires < y.expires ? -1 : 1).slice(0, 3);
    if (exp.length) h += '<h2>Warranties & expiries</h2>' + exp.map(docRow).join('');
    h += spendCard(recs);
    fab = '<button class="fab" id="fabMenu">+</button>';
  } else if (tab === 'tasks') {
    h += '<div class="actions" style="margin:0 0 10px"><button class="btn sec" id="suggestTasks">✨ Suggested tasks</button></div>';
    h += tasks.length ? tasks.map(t => taskRow(t)).join('') : '<div class="empty"><div class="big">⏰</div>Recurring tasks like “change filter” live here.<br>Tap Suggested tasks for ideas.</div>';
    fab = '<button class="fab" id="fabTask">+</button>';
  } else if (tab === 'hist') {
    const f = view.filter || 'all';
    h += '<div class="chips">' + [['all', 'All'], ...Object.entries(REC_TYPES)].map(([k, l]) => `<span class="chip ${f === k ? 'on' : ''}" data-filter="${k}">${l}</span>`).join('') + '</div>';
    const list = recs.filter(r => f === 'all' || r.type === f);
    h += list.length ? list.map(recRow).join('') : '<div class="empty"><div class="big">📒</div>Log maintenance, repairs and upgrades here.</div>';
    fab = '<button class="fab" id="fabRec">+</button>';
  } else if (tab === 'docs') {
    h += docs.length ? docs.map(docRow).join('') : '<div class="empty"><div class="big">📁</div>Receipts, manuals and warranties for this area.</div>';
    fab = '<button class="fab" id="fabDoc">+</button>';
  } else {
    const d = a.details || {};
    const filled = DETAIL_FIELDS.filter(([k]) => d[k]);
    h += filled.length ? '<div class="card"><dl class="kv">' + filled.map(([k, l]) => `<dt>${l}</dt><dd>${esc(d[k])}</dd>`).join('') + '</dl></div>' : '<div class="empty small">No details yet (model, serial number, install date, warranty).</div>';
    h += '<div class="actions"><button class="btn" id="editInfo">Edit info</button><button class="btn sec" id="areaReport">📄 Report</button><button class="btn bad" id="delArea">Delete</button></div>';
  }
  return h + fab;
}

function recRow(r) {
  const n = S.documents.filter(d => d.recordId === r.id).length;
  return `<div class="row" data-rec="${r.id}"><div class="thumb">${(REC_TYPES[r.type] || '🔧').split(' ')[0]}</div><div class="grow"><div class="t">${esc(r.title)}</div>
    <div class="s">${fmt(r.date)}${r.vendor ? ' · ' + esc(r.vendor) : ''}${r.parts ? ' · ' + esc(r.parts) : ''}${n ? ' · 📎 ' + n : ''}${r.projectId ? ' · 🏗️' : ''}</div></div>${recCost(r) ? '<span class="pill">' + money(recCost(r)) + '</span>' : ''}</div>`;
}

function docRow(d) {
  const isImg = (d.mime || '').startsWith('image/');
  const a = areaOf(d.areaId);
  const ex = d.expires ? dueInfo(d.expires) : null;
  return `<div class="row" data-doc="${d.id}">${isImg ? '<img class="thumb" loading="lazy" src="' + fileUrl(d.fileId) + '">' : '<div class="thumb">' + ((d.mime || '').includes('pdf') ? '📕' : '📄') + '</div>'}
    <div class="grow"><div class="t">${esc(d.title)}</div><div class="s">${esc(d.category || '')}${a ? ' · ' + esc(a.name) : ''}${d.size ? ' · ' + (d.size > 1e6 ? (d.size / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(d.size / 1e3)) + ' KB') : ''}</div></div>
    ${ex ? '<span class="pill ' + (ex.n < 0 ? 'bad' : ex.cls) + '">' + (ex.n < 0 ? 'Expired' : 'Until ' + fmt(d.expires)) + '</span>' : ''}</div>`;
}

function renderDocs() {
  const cat = view.cat || 'all';
  const cats = ['all', ...DOC_CATS.filter(c => S.documents.some(d => d.category === c))];
  const list = S.documents.filter(d => cat === 'all' || d.category === cat).sort((x, y) => x.createdAt < y.createdAt ? 1 : -1);
  return '<div class="chips">' + cats.map(c => `<span class="chip ${cat === c ? 'on' : ''}" data-cat="${c}">${c === 'all' ? 'All' : c}</span>`).join('') + '</div>' +
    (list.length ? list.map(docRow).join('') : '<div class="empty"><div class="big">📁</div><p>Your home document library.<br>Deed, insurance, permits, inspection reports, receipts.</p></div>') +
    '<button class="fab" id="fabDoc">+</button>';
}

function renderSearch() {
  return `<input id="q" placeholder="Search tasks, work, documents, areas…" value="${esc(view.q || '')}" autofocus><div id="results" style="margin-top:14px"></div>`;
}
function runSearch(q) {
  q = q.toLowerCase().trim();
  const out = $('#results'); if (!q) { out.innerHTML = '<div class="empty small">Type to search everything.</div>'; return; }
  const m = (...f) => f.some(x => String(x || '').toLowerCase().includes(q));
  const areas = S.areas.filter(a => m(a.name, ...Object.values(a.details || {})));
  const tasks = S.tasks.filter(t => m(t.title, t.notes));
  const recs = S.records.filter(r => m(r.title, r.vendor, r.parts, r.notes));
  const docs = S.documents.filter(d => m(d.title, d.category, d.notes, d.fileName, (areaOf(d.areaId) || {}).name));
  let h = '';
  if (areas.length) h += '<h2>Areas</h2>' + areas.map(a => `<div class="row" data-area="${a.id}"><div class="thumb">${esc(a.icon)}</div><div class="grow t">${esc(a.name)}</div></div>`).join('');
  if (tasks.length) h += '<h2>Tasks</h2>' + tasks.map(t => taskRow(t, true)).join('');
  if (recs.length) h += '<h2>History</h2>' + recs.map(recRow).join('');
  if (docs.length) h += '<h2>Documents</h2>' + docs.map(docRow).join('');
  h += searchExtra(q);
  out.innerHTML = h || '<div class="empty small">No matches.</div>';
}

function renderSettings() {
  const upd = !LOCAL ? '' : UPDATE
    ? `<h2>App updates</h2><div class="banner"><b>Version ${esc(UPDATE)} is available</b><p class="small" style="margin:6px 0 10px">Install it over the current app. Your data stays on the phone.</p><a class="btn" href="https://github.com/${GH_REPO}/releases/latest/download/homelogger.apk">Download update</a></div>`
    : '';
  const backup = LOCAL
    ? `<h2>Backup</h2><div class="card"><p class="small" style="margin-top:0">Your data is stored on this phone only. Save a backup to your Downloads folder now and then (it includes all your documents and photos), so you can restore it after changing phones or reinstalling.</p>
      <div class="actions"><button class="btn" id="dlBackup">Save backup</button><button class="btn sec" id="restore">Restore…</button></div><input type="file" id="restoreFile" accept=".json,application/json" style="display:none"></div>`
    : `<h2>Backup</h2><div class="card"><p class="small" style="margin-top:0">Downloads your data (areas, tasks, history, document list). Uploaded files live in the data folder and are included in your TrueNAS dataset snapshots. The server also keeps 14 daily backups automatically.</p>
      <div class="actions"><a class="btn" href="/api/backup" download>Download backup</a><button class="btn sec" id="restore">Restore…</button></div><input type="file" id="restoreFile" accept=".json" style="display:none"></div>`;
  const sync = !LOCAL ? '' : `<h2>Sync with TrueNAS</h2><div class="card"><p class="small" style="margin-top:0">Keep this phone and your HomeLogger server in step. Changes on either side are merged (the newest edit wins). It syncs when you open the app and a few seconds after each change, whenever the server is reachable on your home network or over VPN.</p>
    <label>Server address</label><input id="syUrl" placeholder="http://192.168.1.50:30101" value="${esc((syncCfg() || {}).url || '')}" autocapitalize="off" autocorrect="off">
    <label>Password (only if you set one on the server)</label><input id="syPw" type="password" value="${esc((syncCfg() || {}).password || '')}">
    <div class="actions"><button class="btn" id="syGo">${syncCfg() ? 'Save & sync now' : 'Connect & sync'}</button>${syncCfg() ? '<button class="btn sec" id="syOff">Turn off</button>' : ''}</div>
    <p class="small" id="syncStatus" style="margin-bottom:0">${esc(syncText())}</p></div>`;
  const alerts = LOCAL ? '' : `<h2>Alerts</h2><div class="card"><p class="small" style="margin-top:0">Optional webhook (Home Assistant, ntfy, etc.). Receives a daily POST when tasks are due or documents expire within 30 days.</p>
    <input id="hook" placeholder="https://…" value="${esc(S.settings.webhook || '')}"><div class="actions"><button class="btn" id="saveHook">Save</button></div></div>`;
  return upd + sync + backup + alerts + `<h2>Appearance</h2><div class="card"><select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
    <h2>About</h2><div class="small" id="ver">HomeLogger ${LOCAL ? esc(APP_VERSION) : ''}</div>`;
}

const ROOTS = ['home', 'docs', 'search', 'settings'];
function render() {
  const nav = ROOTS.includes(view.name) ? view.name : 'home';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === nav));
  $('#back').style.display = ROOTS.includes(view.name) ? 'none' : '';
  $('#title').textContent = view.name === 'area' ? (areaOf(view.id) || {}).name || '' : view.name === 'project' ? (S.projects.find(p => p.id === view.id) || {}).title || 'Project'
    : { home: 'HomeLogger', docs: 'Documents', search: 'Search', settings: 'Settings', info: 'Home info', projects: 'Projects', report: 'History report' }[view.name];
  const app = $('#app');
  const scroll = window.scrollY;
  app.innerHTML = { home: renderHome, area: renderArea, docs: renderDocs, search: renderSearch, settings: renderSettings, info: renderInfo, projects: renderProjects, project: renderProject, report: renderReport }[view.name]();
  if (view.name === 'search') { runSearch(view.q || ''); $('#q').oninput = e => { view.q = e.target.value; runSearch(view.q); }; $('#q').focus(); }
  if (view.name === 'settings') mountSettings();
  window.scrollTo(0, scroll);
  hydrate(app);
}

function mountSettings() {
  if (!LOCAL) fetch('/api/version').then(r => r.json()).then(v => { $('#ver').textContent = 'HomeLogger ' + v.version; });
  const th = $('#theme'); th.value = localStorage.getItem('hl-theme') || 'dark';
  th.onchange = () => { localStorage.setItem('hl-theme', th.value); applyTheme(); };
  const hb = $('#saveHook'); if (hb) hb.onclick = async () => { await api('PUT', '/api/settings', { webhook: $('#hook').value.trim() }); await load(); toast('Saved'); };
  const sg = $('#syGo'); if (sg) sg.onclick = async () => {
    let url = $('#syUrl').value.trim(); if (!url) return toast('Enter the server address');
    if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
    setSyncCfg({ url: url.replace(/\/+$/, ''), password: $('#syPw').value, since: 0, lastPush: '' });
    clearTimeout(syncTimer); await syncNow();
    const cc = syncCfg(); toast(cc && cc.error ? cc.error : 'Synced'); render();
  };
  const so = $('#syOff'); if (so) so.onclick = () => { setSyncCfg(null); clearTimeout(syncTimer); toast('Sync turned off'); render(); };
  const db = $('#dlBackup'); if (db) db.onclick = async () => { try { await localBackup(); } catch (err) { alert('Backup failed: ' + err.message); } };
  $('#restore').onclick = () => $('#restoreFile').click();
  $('#restoreFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm('Replace ALL current data with this backup?')) return;
    try { if (LOCAL) await localRestore(f); else await api('POST', '/api/restore', undefined, f); await load(); view = { name: 'home' }; render(); toast('Restored'); } catch (err) { alert('Restore failed: ' + err.message); }
  };
}
function applyTheme() { document.documentElement.dataset.theme = localStorage.getItem('hl-theme') || 'dark'; }

function go(v) { stack.push(view); view = v; window.scrollTo(0, 0); render(); }

// ---------- Events ----------
document.addEventListener('click', async e => {
  const t = e.target;
  const q = s => t.closest(s);
  let el;
  const fl = q('a[href^="/api/files/"]');
  if (LOCAL && fl) {
    e.preventDefault();
    const fid = fl.getAttribute('href').match(/files\/([a-f0-9]+)/)[1], d = S.documents.find(x => x.fileId === fid) || {};
    return bridgeSend(fid, d.fileName || 'file', d.mime || 'application/octet-stream', fl.hasAttribute('download') ? 'download' : 'open');
  }
  if ((el = q('[data-done]'))) { e.stopPropagation(); return doneForm(S.tasks.find(x => x.id === el.dataset.done)); }
  if ((el = q('[data-task]'))) { const task = S.tasks.find(x => x.id === el.dataset.task); return taskForm(task.areaId, task); }
  if ((el = q('[data-rec]'))) { const r = S.records.find(x => x.id === el.dataset.rec); return recordView(r); }
  if ((el = q('[data-doc]'))) return docView(S.documents.find(x => x.id === el.dataset.doc));
  if ((el = q('[data-area]'))) return go({ name: 'area', id: el.dataset.area, tab: 'dash' });
  if ((el = q('[data-tab]'))) { view.tab = el.dataset.tab; return render(); }
  if ((el = q('[data-filter]'))) { view.filter = el.dataset.filter; return render(); }
  if ((el = q('[data-cat]'))) { view.cat = el.dataset.cat; return render(); }
  if (q('#addArea') || q('#fabArea')) return areaForm();
  if (q('#editArea')) return areaForm(areaOf(view.id));
  if (q('#editInfo')) return infoForm(areaOf(view.id));
  if (q('#fabTask')) return taskForm(view.id);
  if (q('#fabRec')) return recordForm(view.id);
  if (q('#fabDoc')) return docForm(view.name === 'area' ? view.id : '');
  if (q('#fabMenu')) return sheet(`<h3>Add</h3><div class="actions" style="flex-direction:column">
    <button class="btn" data-x="rec">🔧 Log work (maintenance, repair, upgrade)</button><button class="btn sec" data-x="task">⏰ New recurring task</button><button class="btn sec" data-x="doc">📎 Add document / receipt</button></div>`,
    s => s.onclick = ev => { const x = ev.target.dataset.x; if (!x) return; s.close(); ({ rec: () => recordForm(view.id), task: () => taskForm(view.id), doc: () => docForm(view.id) })[x](); });
  if (q('#delArea')) {
    const a = areaOf(view.id);
    if (!confirm('Delete "' + a.name + '" with all its tasks, history and documents? This cannot be undone.')) return;
    await api('DELETE', '/api/areas/' + a.id); await load(); stack.length = 0; view = { name: 'home' }; render(); return toast('Area deleted');
  }
});
$('#back').onclick = () => { view = stack.pop() || { name: 'home' }; render(); };
$('#hsearch').onclick = () => { stack.length = 0; view = { name: 'search' }; render(); };
$('#nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; stack.length = 0; view = { name: b.dataset.v }; render(); };

function recordView(r) {
  const docs = S.documents.filter(d => d.recordId === r.id);
  sheet(`<h3>${esc(r.title)}</h3><dl class="kv"><dt>Type</dt><dd>${REC_TYPES[r.type] || ''}</dd><dt>Date</dt><dd>${fmt(r.date)}</dd>${recCost(r) ? '<dt>Cost</dt><dd>' + money(recCost(r)) + '</dd>' : ''}${(S.projects.find(p => p.id === r.projectId)) ? '<dt>Project</dt><dd>' + esc(S.projects.find(p => p.id === r.projectId).title) + '</dd>' : ''}${r.vendor ? '<dt>Vendor</dt><dd>' + esc(r.vendor) + '</dd>' : ''}${r.parts ? '<dt>Parts</dt><dd>' + esc(r.parts) + '</dd>' : ''}${r.notes ? '<dt>Notes</dt><dd>' + esc(r.notes) + '</dd>' : ''}</dl>
    <h2>Attachments</h2>${docs.length ? docs.map(docRow).join('') : '<div class="small">None</div>'}
    <div class="actions"><button class="btn sec" id="attach">📎 Attach</button><button class="btn" id="edit">Edit</button></div>`,
  el => {
    el.querySelector('#edit').onclick = () => { el.close(); recordForm(r.areaId, r); };
    el.querySelector('#attach').onclick = () => { el.close(); docForm(r.areaId, null, r.id); };
    el.querySelectorAll('[data-doc]').forEach(x => x.onclick = ev => { ev.stopPropagation(); el.close(); docView(S.documents.find(d => d.id === x.dataset.doc)); });
  });
}

function docView(d) {
  if (!d) return;
  const img = (d.mime || '').startsWith('image/'), pdf = (d.mime || '').includes('pdf');
  const a = areaOf(d.areaId), r = S.records.find(x => x.id === d.recordId);
  sheet(`<h3>${esc(d.title)}</h3>
    ${img ? '<img src="' + fileUrl(d.fileId) + '" style="width:100%;border-radius:12px;margin-bottom:10px">' : ''}
    ${pdf && !LOCAL ? '<iframe src="' + fileUrl(d.fileId) + '" style="width:100%;height:50vh;border:0;border-radius:12px;background:#fff;margin-bottom:10px"></iframe>' : ''}
    <dl class="kv"><dt>Category</dt><dd>${esc(d.category || '')}</dd>${a ? '<dt>Area</dt><dd>' + esc(a.name) + '</dd>' : ''}${r ? '<dt>Work entry</dt><dd>' + esc(r.title) + '</dd>' : ''}${(S.projects.find(x => x.id === d.projectId)) ? '<dt>Project</dt><dd>' + esc(S.projects.find(x => x.id === d.projectId).title) + '</dd>' : ''}${(S.facts.find(x => x.id === d.factId)) ? '<dt>Home info</dt><dd>' + esc(S.facts.find(x => x.id === d.factId).title) + '</dd>' : ''}${d.expires ? '<dt>Expires</dt><dd>' + fmt(d.expires) + '</dd>' : ''}<dt>File</dt><dd>${esc(d.fileName || '')}</dd>${d.notes ? '<dt>Notes</dt><dd>' + esc(d.notes) + '</dd>' : ''}</dl>
    <div class="actions"><a class="btn sec" href="${fileUrl(d.fileId, true)}" download>Download</a><a class="btn sec" href="${fileUrl(d.fileId)}" target="_blank" rel="noopener">Open</a><button class="btn" id="edit">Edit</button></div>`,
  el => { el.querySelector('#edit').onclick = () => { el.close(); docForm(d.areaId, d); }; });
}

applyTheme();
(LOCAL ? localInit() : Promise.resolve()).then(load).then(render).then(() => scheduleSync(800)).then(checkUpdate).catch(e => { $('#app').innerHTML = '<div class="empty">Could not load data: ' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
