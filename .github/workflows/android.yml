name: Android APK
on:
  push:
    branches: [main, android-apk, sync]
    paths: ['android/**', 'public/**', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the web app into the APK
        run: |
          VER=$(cat VERSION)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p android/app/src/main/assets
          cp -r public/. android/app/src/main/assets/
          printf '{"version":"%s"}' "$VER" > android/app/src/main/assets/version.json
      - name: Build release APK
        run: gradle -p android assembleRelease -PappVersion="$VER" --no-daemon --stacktrace
      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk homelogger.apk
          cp homelogger.apk "homelogger-${VER//./_}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: homelogger-apk
          path: homelogger*.apk
      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="homelogger.apk homelogger-${VER//./_}.apk"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" $FILES --clobber
          else
            gh release create "v$VER" $FILES --title "HomeLogger $VER" --notes "Android APK for HomeLogger $VER. Install over the previous version; your data stays on the phone. See CHANGELOG.md." --latest
          fi
