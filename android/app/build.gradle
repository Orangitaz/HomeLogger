plugins {
    id 'com.android.application'
}

// Version comes from the repo's VERSION file via -PappVersion=x.y.z (see .github/workflows/android.yml)
def appVersion = (project.findProperty('appVersion') ?: '0.0.1').toString()
def vp = appVersion.tokenize('.').collect { it.toInteger() }

android {
    namespace 'com.orangitaz.homelogger'
    compileSdk 34

    defaultConfig {
        applicationId 'com.orangitaz.homelogger'
        minSdk 29
        targetSdk 34
        versionCode vp[0] * 10000 + vp[1] * 100 + vp[2]
        versionName appVersion
    }

    signingConfigs {
        release {
            // Fixed key so every build installs over the previous one.
            storeFile file('../homelogger.keystore')
            storePassword 'homelogger'
            keyAlias 'homelogger'
            keyPassword 'homelogger'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
